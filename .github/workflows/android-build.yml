name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          
      - name: Install dependencies
        run: |
          npm install
          cd apps/android
          npm install
          
      - name: Build web version
        run: npm run build
        
      - name: Setup Android Cargo.toml
        run: |
          cd apps/android
          cp src-tauri/Cargo.toml Cargo.toml
          cp src-tauri/build.rs build.rs
          mkdir -p src
          cp src-tauri/src/lib.rs src/lib.rs
          mkdir -p src-tauri/icons
          cp icons/*.png src-tauri/icons/ 2>/dev/null || true
          
      - name: Build Android APK
        run: |
          cd apps/android
          npx tauri android build
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: apps/android/target/aarch64/release/app.apk
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: apps/android/target/aarch64/release/app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
