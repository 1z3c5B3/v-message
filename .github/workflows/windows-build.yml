name: Windows EXE Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Ручной запуск

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build web version
        run: npm run build

      - name: Install Tauri CLI
        run: npm install -D @tauri-apps/cli@latest

      - name: Build Windows EXE
        run: npx tauri build --target x86_64-pc-windows-msvc
        working-directory: ./src-tauri

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: V-Message-Windows-EXE
          path: src-tauri/target/release/V-Message.exe
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: src-tauri/target/release/V-Message.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
