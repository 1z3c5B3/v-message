[package]
name = "v-message"
version = "2.4.0"
description = "V-Message Android Application"
authors = ["V-Message Team"]
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "v_message"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[target.'cfg(target_os = "android")'.dependencies]
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
