<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6E5CE6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8171F0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#grad)"/>
  
  <!-- Chat bubble -->
  <path d="M 100 150 L 412 150 L 412 350 L 300 350 L 250 400 L 200 350 L 100 350 Z" fill="white"/>
  
  <!-- Message lines -->
  <rect x="140" y="200" width="232" height="20" rx="10" fill="#6E5CE6"/>
  <rect x="140" y="240" width="180" height="20" rx="10" fill="#8171F0"/>
  <rect x="140" y="280" width="150" height="20" rx="10" fill="#A394F5"/>
  
  <!-- Notification dot -->
  <circle cx="380" cy="180" r="30" fill="#F85149"/>
  <text x="380" y="195" font-family="Arial" font-size="40" font-weight="bold" fill="white" text-anchor="middle">!</text>
</svg>
